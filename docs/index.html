<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Santa in AR</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #f6f3ee;
      --fg: #1d1d1f;
      --muted: #6b6b70;
      --accent: #b3121b;
      --accent-fg: #fff;
      --card: #ffffffcc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #f2f2f2;
        --muted: #a0a3aa;
        --accent: #e0333c;
        --card: #1f2228cc;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 16px 0;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    model-viewer {
      flex: 1;
      width: 100%;
      min-height: 0;
      --poster-color: transparent;
      --progress-bar-color: var(--accent);
    }

    /* AR button (slot="ar-button") */
    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      background: var(--accent);
      color: var(--accent-fg);
      font: 600 16px system-ui, sans-serif;
      box-shadow: 0 6px 20px #0004;
      cursor: pointer;
    }

    .controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }
    .controls button {
      border: 1px solid #8884;
      background: var(--card);
      color: var(--fg);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 8px 14px;
      font: 500 14px system-ui, sans-serif;
      cursor: pointer;
    }

    .no-ar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    model-viewer[ar-status="session-started"] .no-ar,
    model-viewer[ar-status="session-started"] .controls { display: none; }

    /* Hint shown while placing in WebXR */
    .ar-prompt {
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      display: none;
      background: #000a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
    }
    model-viewer[ar-status="session-started"] .ar-prompt { display: block; }
    model-viewer[ar-tracking="tracking"] .ar-prompt { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Santa in AR</h1>
    <p>Drag to rotate · pinch to zoom · tap "View in your space" on a phone</p>
  </header>

  <model-viewer
    id="santa"
    src="santa.glb"
    ios-src="santa.usdz"
    alt="A rigged 3D Santa Claus waving"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    touch-action="pan-y"
    camera-orbit="25deg 80deg auto"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.05"
    environment-image="neutral"
    autoplay
    animation-name="Santa_Wave">

    <button slot="ar-button" class="ar-button">🎅 View in your space</button>
    <div class="ar-prompt">Move your phone slowly to find the floor</div>

    <div class="controls">
      <button id="toggleAnim" type="button">Pause wave</button>
    </div>

    <div class="no-ar" id="noAr" hidden>
      AR isn't available in this browser. Open this page on an ARCore Android phone (Chrome) or an iPhone/iPad (Safari).
    </div>
  </model-viewer>

  <script type="module">
    const mv = document.getElementById('santa');
    const btn = document.getElementById('toggleAnim');

    mv.addEventListener('load', () => {
      // Fall back to the first animation if the name differs.
      if (!mv.availableAnimations.includes('Santa_Wave') && mv.availableAnimations.length) {
        mv.animationName = mv.availableAnimations[0];
      }
      mv.play();
      if (!mv.canActivateAR) document.getElementById('noAr').hidden = false;
    });

    btn.addEventListener('click', () => {
      if (mv.paused) { mv.play(); btn.textContent = 'Pause wave'; }
      else { mv.pause(); btn.textContent = 'Play wave'; }
    });
  </script>
</body>
</html>
