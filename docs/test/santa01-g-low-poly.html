<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test G · A third of the triangles</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #f6f3ee;
      --fg: #1d1d1f;
      --muted: #6b6b70;
      --accent: #a3262d;
      --accent-fg: #fff;
      --card: #ffffffcc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #f2f2f2;
        --muted: #a0a3aa;
        --accent: #f07177;
        --card: #1f2228cc;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 16px 0;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 22px; }
    header .edition { color: var(--accent); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    header a { color: var(--accent); }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    model-viewer {
      flex: 1;
      width: 100%;
      min-height: 0;
      --poster-color: transparent;
      --progress-bar-color: var(--accent);
    }

    /* AR button (slot="ar-button") */
    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      background: var(--accent);
      color: var(--accent-fg);
      font: 600 16px system-ui, sans-serif;
      box-shadow: 0 6px 20px #0004;
      cursor: pointer;
    }

    .controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }
    .controls button {
      border: 1px solid #8884;
      background: var(--card);
      color: var(--fg);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      padding: 8px 14px;
      font: 500 14px system-ui, sans-serif;
      cursor: pointer;
    }

    .no-ar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    model-viewer[ar-status="session-started"] .no-ar,
    model-viewer[ar-status="session-started"] .controls { display: none; }

    /* Hint shown while placing in WebXR */
    .ar-prompt {
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      display: none;
      background: #000a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
    }
    model-viewer[ar-status="session-started"] .ar-prompt { display: block; }
    model-viewer[ar-tracking="tracking"] .ar-prompt { display: none; }
  </style>
</head>
<body>
  <header>
    <p><a href="./">← All tests</a></p>
    <h1>G · A third of the triangles</h1>
    <p class="edition">Quick Look test · 45k triangles instead of 135k</p>
    <p id="launchHint" role="status">Opening AR on supported phones…</p>
  </header>

  <model-viewer
    id="santa01"
    data-src="../santa01.glb?v=chai-4"
    ios-src="santa01-g-low-poly.usdz?v=1"
    alt="A laughing Santa in red velvet and brown leather boots pouring chai from a golden brass kettle into a glass, then raising it to his lips and sipping it"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    touch-action="pan-y"
    camera-orbit="18deg 80deg auto"
    poster="../santa01-poster.webp?v=chai-2"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.05"
    environment-image="neutral"
    autoplay
    animation-name="Santa01_Natural_Shoulders_Drink_Cup_Tilt">

    <button slot="ar-button" class="ar-button">🎅 View in your space</button>
    <div class="ar-prompt">Move your phone slowly to find the floor</div>

    <div class="controls">
      <button id="toggleAnim" type="button">Pause animation</button>
    </div>

    <div class="no-ar" id="noAr" hidden>
      AR isn't available in this browser. Open this page on an ARCore Android phone (Chrome) or an iPhone/iPad (Safari).
    </div>
  </model-viewer>

  <script type="module">
    const mv = document.getElementById('santa01');
    const btn = document.getElementById('toggleAnim');
    const hint = document.getElementById('launchHint');
    const tapHint = 'If AR doesn’t open automatically, tap “View in your space”.';
    const animation = 'Santa01_Natural_Shoulders_Drink_Cup_Tilt';

    // iPhone/iPad open the USDZ in AR Quick Look, which never uses the GLB. Same test as model-viewer.
    const quickLook = (() => {
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) return false;
      if (window.webkit && window.webkit.messageHandlers) {
        return /CriOS\/|EdgiOS\/|FxiOS\/|GSA\/|DuckDuckGo\//.test(navigator.userAgent);
      }
      const a = document.createElement('a');
      return Boolean(a.relList && a.relList.supports && a.relList.supports('ar'));
    })();

    // The GLB (the in-page 3D view) is requested only once, from data-src.
    let modelRequested = false;
    const loadModel = () => {
      if (!modelRequested) { modelRequested = true; mv.src = mv.dataset.src; }
    };

    mv.addEventListener('load', () => {
      // Fall back to the first animation if the name differs.
      if (!mv.availableAnimations.includes(animation) && mv.availableAnimations.length) {
        mv.animationName = mv.availableAnimations[0];
      }
      mv.play();
    }, { once: true });

    async function launchAR() {
      await customElements.whenDefined('model-viewer');
      await mv.updateComplete;
      // model-viewer picks the AR mode asynchronously after an update.
      for (let i = 0; i < 20 && !mv.canActivateAR; i++) await new Promise(r => setTimeout(r, 50));
      if (!mv.canActivateAR) {
        document.getElementById('noAr').hidden = false;
        hint.textContent = 'Drag to rotate · pinch to zoom';
        return false;
      }
      // Native AR first; a browser may still require a user gesture.
      // Attempt once so returning from AR never opens it again in a loop.
      hint.textContent = tapHint;
      try {
        await mv.activateAR();
        return true;
      } catch (error) {
        hint.textContent = 'Tap “View in your space” to open AR.';
        console.warn('Automatic AR launch was blocked:', error);
        return false;
      }
    }

    if (quickLook) {
      // Open Quick Look straight away so the USDZ downloads on its own, and hold the GLB back
      // until the person returns to the page or touches it.
      launchAR().then(opened => {
        if (!opened) loadModel();
        else hint.textContent = tapHint + ' Tap Santa to see him in 3D here.';
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') loadModel();
      });
      window.addEventListener('focus', loadModel);
      window.addEventListener('pageshow', e => { if (e.persisted) loadModel(); });
      document.addEventListener('pointerdown', e => {
        if (!e.target.closest('.ar-button')) loadModel();
      });
    } else {
      // Android and desktop: Scene Viewer and WebXR need the GLB, so load it, then open AR.
      loadModel();
      mv.addEventListener('load', launchAR, { once: true });
    }

    mv.addEventListener('ar-status', ({ detail: { status } }) => {
      if (status === 'failed') hint.textContent = tapHint;
    });

    btn.addEventListener('click', () => {
      if (mv.paused) { mv.play(); btn.textContent = 'Pause animation'; }
      else { mv.pause(); btn.textContent = 'Play animation'; }
    });
  </script>
</body>
</html>
